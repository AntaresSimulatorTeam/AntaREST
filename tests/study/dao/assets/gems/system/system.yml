system:
  id: System 8_1
  description: Electrolyser - V8.6
  components:
    - id: electrolyser
      model: andromede-v1-models-weo-hybrid.electrolyser
      scenario-group: sg1
      parameters:
        - id: efficiency
          scenario-dependent: false
          time-dependent: false
          value: 0.7
        - id: p_max
          scenario-dependent: false
          time-dependent: false
          value: 300


  area-connections:
    - component: electrolyser
      port: hydrogen_port
      area: west-H2

    - component: electrolyser
      port: power_port
      area: west