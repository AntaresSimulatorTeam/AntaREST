view:

  id: view_storage

  scope:
    location:
      taxonomy-category: balance # category of the taxonomy, the components of which serves as locational objects. Main case is 'area'.

  taxonomy: antares_legacy_taxonomy
  
  aggregations-patterns:
    - id: annual_all_scenario
      time-granularity: year #hour, day, week, month ou year.
      scenario: true
    - id: hourly_per_scenario
      time-granularity: hour #hour, day, week, month ou year.
      scenario: false

  metrics:  #reference to the selected metric among the catalog
      - id: antares_legacy_short_term_storage_catalog.CASHFLOW
      - id: antares_legacy_short_term_storage_catalog.LEVELS
      - id: antares_legacy_short_term_storage_catalog.P_INJECTION
      - id: antares_legacy_short_term_storage_catalog.P_WITHDRAWAL