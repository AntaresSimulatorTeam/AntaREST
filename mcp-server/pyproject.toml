[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antares-web-mcp"
version = "0.1.0"
description = "MCP server exposing Antares Web to AI assistants (Claude, GitHub Copilot, ...)"
readme = "README.md"
authors = [{ name = "RTE, Antares Web Team" }]
license = "MPL-2.0"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
]
# This package is a client of the Antares Web REST API: it must NOT depend on `antarest`.
# It has its own environment so that its dependencies never leak into the backend one.
dependencies = [
    "mcp~=2.3.0",
    "httpx2>=2.16.0",
    "pydantic>=2.12.0",
    "click>=8.1.0",
    "anthropic~=2.8",
]

[project.scripts]
antares-web-mcp = "antares_web_mcp.__main__:main"
# Agent process started by the Antares Web backend for `POST /v1/assistant/chat` (JSON on stdin, events on stdout).
antares-web-assistant = "antares_web_mcp.assistant.runner:main"
# Command-line chat with the assistant, through the Antares Web endpoint.
antares-assistant = "antares_web_mcp.assistant.cli:main"

[project.urls]
Repository = "https://github.com/AntaresSimulatorTeam/AntaREST"
Documentation = "https://antares-web.readthedocs.io/en/latest/mcp-server/"

[dependency-groups]
dev = [
    "pytest~=9.2.0",
    "mypy~=2.4.1",
    "ruff~=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/antares_web_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = "pydantic.mypy"
enable_error_code = "explicit-override"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["antares_web_mcp"]

[tool.ruff.format]
quote-style = "double"
